[package]
name = "plaudit-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Command-line tool to export your Plaud recordings and transcripts"
readme = "README.md"
repository = "https://github.com/lmmx/plaudit"

[[bin]]
name = "plaudit"
path = "src/main.rs"

[dependencies]
plaudit-core = { path = "../plaudit-core" }
clap = { workspace = true }

[package.metadata.binstall]
pkg-fmt = "tgz"
pkg-url = "https://github.com/lmmx/plaudit/releases/download/plaudit-v{ version }/plaudit-{ target }-v{ version }.tar.gz"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "https://github.com/lmmx/plaudit/releases/download/plaudit-v{ version }/plaudit-aarch64-pc-windows-msvc-v{ version }.zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "https://github.com/lmmx/plaudit/releases/download/plaudit-v{ version }/plaudit-x86_64-pc-windows-msvc-v{ version }.zip"

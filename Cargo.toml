[workspace]
resolver = "2"
members = ["plaudit-core", "plaudit-cli"]

[workspace.package]
authors = ["Louis Maddox <louismmx@gmail.com>"]
edition = "2021"
homepage = "https://github.com/lmmx/plaudit"
license = "MIT"
repository = "https://github.com/lmmx/plaudit"

[workspace.dependencies]
plaudit-core = { path = "plaudit-core", version = "0.1.2" }

ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
clap = { version = "4", features = ["derive"] }

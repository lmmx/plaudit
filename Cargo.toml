# Cargo.toml
[workspace]
resolver = "2"
members = ["plaudit-core", "plaudit-cli"]

[workspace.dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
clap = { version = "4", features = ["derive"] }
